services:
  db:
    image: postgres:16-alpine
    container_name: manager_library_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library_secret}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-library} -d ${POSTGRES_DB:-library}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../test-manager-library-3239188-api
      dockerfile: Dockerfile
    container_name: manager_library_api
    restart: unless-stopped
    environment:
      APP_NAME: ManagerLibrary
      APP_ENV: local
      APP_KEY: base64:4D5L5H4qf3N0J4T8K7M1P9Q3S5U7W9Y1B3D5F7H9J1L=
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: library
      DB_USERNAME: library
      DB_PASSWORD: library_secret
      DB_SCHEMA: library
      JWT_SECRET: sdd_library_3239188_secret_jwt_token_sign_key_adso
      JWT_TTL_HOURS: 8
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin_secret_pass
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ../test-manager-library-3239188-app
      dockerfile: Dockerfile
    container_name: manager_library_app
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
    name: manager_library_db_data
